  <text x="540" y="980" text-anchor="middle" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2">/public/images/festivals/</text>
  <text x="540" y="1120" text-anchor="middle" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="16" opacity="0.8">Update lib/festivalPopupConfig.ts to switch festivals</text>
</svg>

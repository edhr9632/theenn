  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect x="48" y="48" width="984" height="1254" rx="28" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>
  <text x="540" y="280" text-anchor="middle" fill="#e0f2fe" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="8">EDUCATION TODAY</text>
  <text x="540" y="620" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">Festival Greeting</text>

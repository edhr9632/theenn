<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Happy Diwali">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="45%" stop-color="#3d1a5c"/>
      <stop offset="100%" stop-color="#7a1f2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect x="48" y="48" width="984" height="1254" rx="28" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.85"/>
  <rect x="68" y="68" width="944" height="1214" rx="22" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.35"/>

  <text x="540" y="220" text-anchor="middle" fill="#fde68a" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="8">EDUCATION TODAY</text>
  <text x="540" y="270" text-anchor="middle" fill="#fef3c7" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="4" opacity="0.8">EDUCATION NEWS NETWORK</text>

  <!-- Diya -->
  <ellipse cx="540" cy="560" rx="120" ry="28" fill="#7c2d12" opacity="0.45"/>
  <path d="M420 540 C420 500 480 470 540 470 C600 470 660 500 660 540 C640 580 440 580 420 540Z" fill="url(#gold)"/>
  <ellipse cx="540" cy="500" rx="22" ry="70" fill="#fde68a"/>
  <ellipse cx="540" cy="470" rx="14" ry="36" fill="#fff7ed" opacity="0.9"/>

  <text x="540" y="720" text-anchor="middle" fill="#fff7ed" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700">Happy Diwali</text>
  <text x="540" y="790" text-anchor="middle" fill="#fde68a" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="2">Festival of Lights</text>

  <text x="540" y="920" text-anchor="middle" fill="#fef3c7" font-family="Arial, Helvetica, sans-serif" font-size="22" opacity="0.9">Wishing educators, students &amp; families</text>
  <text x="540" y="960" text-anchor="middle" fill="#fef3c7" font-family="Arial, Helvetica, sans-serif" font-size="22" opacity="0.9">a season of warmth, wisdom &amp; joy</text>

  <text x="540" y="1120" text-anchor="middle" fill="#fbbf24" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3" opacity="0.75">REPLACE THIS IMAGE FOR YOUR FESTIVAL POSTER</text>
  <text x="540" y="1160" text-anchor="middle" fill="#fde68a" font-family="Arial, Helvetica, sans-serif" font-size="14" opacity="0.55">/public/images/festivals/</text>
</svg>
